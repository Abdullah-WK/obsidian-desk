# Graphite starship prompt (spec: "user@host path  branch › "), rendered by `caelestia scheme`.
# Selected via STARSHIP_CONFIG in ~/.config/caelestia/user-config.fish, so the Caelestia dots'
# own ~/.config/starship.toml stays untouched. Named colours follow the terminal palette, which
# the scheme already sets; the two fixed hexes are re-rendered on every scheme change.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
continuation_prompt = "[› ](#{{ outline.hex }})"

format = "${custom.user}$hostname$directory$git_branch$git_status$character"
right_format = ""

[username]
show_always = true
format = "[$user]($style)"
style_user = "green"
style_root = "red"

[hostname]
ssh_only = false
format = "[@$hostname]($style) "
style = "#{{ outline.hex }}"
trim_at = "."

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "blue"
read_only = " "
read_only_style = "red"
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "yellow"
only_attached = false

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "#{{ outline.hex }}"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
modified = "*"
staged = "+"
untracked = "?"
stashed = "≡"
conflicted = "!"

[character]
format = "$symbol "
success_symbol = "[›](bold #{{ primary.hex }})"
error_symbol = "[›](bold red)"
vimcmd_symbol = "[‹](bold #{{ primary.hex }})"

# username: per-character iridescent sweep (ice blue → violet → pink → peach), bold.
# starship styles one module with one colour, so a custom module paints the name itself.
[custom.user]
command = "printf '%s' \"$USER\" | awk 'function h2r(h,s,l,  c,x,m,r,g,b){h=(h%360+360)%360;c=(1-(2*l-1<0?-(2*l-1):2*l-1))*s;x=c*(1-((h/60)%2-1<0?-((h/60)%2-1):(h/60)%2-1));m=l-c/2;if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x};return sprintf(\"%d;%d;%d\",(r+m)*255,(g+m)*255,(b+m)*255)}{n=length($0);for(i=1;i<=n;i++)printf \"\\033[1;38;2;%sm%s\",h2r(190+(i-1)*210/(n>1?n-1:1),0.6,0.72),substr($0,i,1);printf \"\\033[0m\"}'"
when = true
format = "$output"
