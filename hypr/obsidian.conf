# Obsidian desk: classic hyprland.conf equivalent of hypr/obsidian.lua + hypr-vars.lua.
# Only for installs that use a .conf config; the Caelestia dots use Lua (see obsidian.lua).
exec-once = qs -c onyx

general {
    gaps_in = 6
    gaps_out = 10
    border_size = 1
    col.active_border = $outlineVariant
    col.inactive_border = $surfaceContainerHigh
}
decoration {
    rounding = 10
    shadow { enabled = false }
    blur { enabled = false }
}
animations {
    enabled = true
    bezier = std, 0.2, 0, 0, 1
    bezier = decel, 0, 0, 0, 1
    animation = windows, 1, 2, decel, popin 92%
    animation = windowsOut, 1, 2, std, popin 92%
    animation = fade, 1, 2, std
    animation = workspaces, 1, 2.5, decel, slide
    animation = layers, 1, 2, decel, fade
}
bind = SUPER, L, exec, qs -c onyx ipc call lock lock
bind = SUPER SHIFT, B, exec, qs -c onyx ipc call bar toggle
bind = SUPER SHIFT, W, exec, qs -c onyx ipc call wallpaper toggle
bind = SUPER, Escape, exec, qs -c onyx ipc call session toggle
bind = CTRL ALT, Delete, exec, qs -c onyx ipc call session toggle
layerrule = noanim, onyx-hotzone
layerrule = noanim, onyx-widgets
layerrule = noanim, onyx-bar
